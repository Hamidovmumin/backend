<!-- ══ NAV ══════════════════════════════════════════ -->
<nav class="site-nav">
    <div class="container h-100">
        <div class="d-flex align-items-center justify-content-between gap-3 h-100 flex-wrap">

            <!-- Logo -->
            <a href="#" class="d-flex align-items-center gap-3 text-decoration-none flex-shrink-0">
                <div class="logo-mark">
                    <i class="bi bi-book-half"></i>
                </div>
                <div>
                    <div class="brand-name">Novelora</div>
                    <div class="brand-sub">Book Store</div>
                </div>
            </a>

            <!-- Search -->
            <div class="search-shell mx-lg-auto">
                <input type="search" placeholder="Kitab, müəllif ya kateqoriya axtar…">
                <i class="bi bi-search si"></i>
            </div>

            <!-- Right Side -->
            <div class="d-flex align-items-center gap-2 flex-shrink-0">

                {% if user.is_authenticated %}

                <div class="btn-nav-user">

                    <div class="user-default">
                        <i class="bi bi-person"></i>
                        <span>{{ user.username }}</span>
                    </div>

                    <div class="user-dropdown">
                        <a href="{% url 'logout' %}" class="logout-link">
                            <i class="bi bi-box-arrow-right"></i>
                            Logout
                        </a>
                    </div>

                </div>

                {% else %}

                <a href="{% url 'login' %}" class="btn-nav btn-nav-outline">
                    <i class="bi bi-person"></i>
                    Login
                </a>

                {% endif %}

                <!-- Cart -->
                <a href="{% url 'cart-page' %}">
                <button class="btn-nav btn-nav-fill" id="cartBtn">
                    <i class="bi bi-bag"></i>
                    Səbət
                    <span class="cart-count" id="cartCount">0</span>
                </button>
                    </a>

            </div>
        </div>
    </div>
</nav>
